[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-engineering-agent"
version = "0.1.0"
description = "A PowerShell-first local engineering agent for inspecting, auditing, testing, and reporting on software projects."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Universal Engineering Agent"}]
dependencies = []

[project.optional-dependencies]
llm = ["openai>=1.40.0"]
dev = ["pytest>=8.0"]

[project.scripts]
uea = "uea.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
